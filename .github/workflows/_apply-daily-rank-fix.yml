name: Apply and verify Daily rank fix
on:
  push:
    branches: [fix/daily-rank-badges-4-48-1]
    paths:
      - .github/workflows/_apply-daily-rank-fix.yml
      - test/daily-rank.js
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-rank-badges-4-48-1
      - name: Reproduce the original regression
        shell: bash
        run: |
          if node test/daily-rank.js > /tmp/daily-rank-before.log 2>&1; then
            cat /tmp/daily-rank-before.log
            echo 'Expected the original rollover regression; refusing to patch changed behavior.'
            exit 1
          fi
          cat /tmp/daily-rank-before.log
          grep -q 'FAIL next Daily preserves World Beater and Champion' /tmp/daily-rank-before.log
      - name: Apply scoped patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          function once(text, old, replacement) {
            assert.equal(text.split(old).length - 1, 1, 'Expected exactly one patch target: ' + old.slice(0, 100));
            return text.replace(old, () => replacement);
          }
          let html = fs.readFileSync('index.html', 'utf8');
          html = once(html,
          `function loadDaily(){ try{ return JSON.parse(store.get("tl_daily")||"{}")||{}; }catch(e){ return {}; } }
          function saveDaily(d){ store.set("tl_daily", JSON.stringify(d)); }`,
          `function loadDaily(){
            let d = {};
            try{
              const saved = JSON.parse(store.get("tl_daily")||"{}");
              if(saved && typeof saved === "object" && !Array.isArray(saved)) d = saved;
            }catch(e){}
            if(!Number.isSafeInteger(d.bestRank) || d.bestRank < 1) delete d.bestRank;
            // Older Daily saves dropped bestRank. A recorded World Beater unlock is
            // evidence of an exact #1, so recover it when that local history survives.
            try{
              const seen = JSON.parse(store.get("tl_achseen")||"[]");
              if(Array.isArray(seen) && seen.includes("World Beater")) d.bestRank = 1;
            }catch(e){}
            return d;
          }
          function saveDaily(d){
            // bestRank is lifetime progress, not a field belonging to today's run.
            // Read the latest value here so partial saves and stale callbacks cannot
            // erase or downgrade it. Do NOT merge other old fields: p must clear when
            // a partial attempt finishes, and the new run must replace the old one.
            const previous = loadDaily(), next = { ...d };
            const ranks = [previous.bestRank, next.bestRank].filter(r => Number.isSafeInteger(r) && r > 0);
            if(ranks.length) next.bestRank = Math.min(...ranks);
            else delete next.bestRank;
            store.set("tl_daily", JSON.stringify(next));
          }`);
          html = once(html,
          `  if(!fresh.length) return;
            store.set(ACH_SEEN, JSON.stringify(done));`,
          `  if(!fresh.length) return;
            // Keep the unlock history monotonic, including evidence used by recovery.
            store.set(ACH_SEEN, JSON.stringify([...new Set([...seen, ...done])]));`);
          html = once(html,
          `    if(b && b.me && b.me.rank){ const d = loadDaily(); if(!d.bestRank || b.me.rank < d.bestRank){ d.bestRank = b.me.rank; saveDaily(d); } }`,
          `    if(b && b.me && Number.isSafeInteger(b.me.rank) && b.me.rank > 0){
                const d = loadDaily();
                if(!d.bestRank || b.me.rank < d.bestRank){
                  d.bestRank = b.me.rank;
                  saveDaily(d);
                  checkAchievements();   // record the unlock as soon as the rank arrives
                }
              }`);
          html = once(html, 'const BUILD = "4.48.0";', 'const BUILD = "4.48.1";');
          let sw = fs.readFileSync('sw.js', 'utf8');
          sw = once(sw, "const CACHE_NAME = 'yearworm-4.48.0';", "const CACHE_NAME = 'yearworm-4.48.1';");
          let notes = fs.readFileSync('NOTES.md', 'utf8');
          notes = once(notes, '\n## What it is\n', `
          ## 4.48.1 — preserve Daily rank achievements
          - Daily saves now retain the lowest valid lifetime bestRank while replacing
            run-specific fields normally (including clearing the partial-attempt flag).
          - World Beater can recover an already-lost #1 from a surviving local
            tl_achseen unlock record. No rank is invented when that evidence is absent;
            this does not restore achievements after browser data has been cleared.
          - Rank responses check achievements immediately; unlock history is retained
            rather than replaced when another achievement is awarded.
          - Regression: node test/daily-rank.js (no dependencies). Covers rollover,
            worse/better ranks, partial completion, reload, stale snapshots, recovery,
            malformed storage, unlock history, script syntax and release-version parity.

          ## What it is
          `);
          fs.writeFileSync('index.html', html);
          fs.writeFileSync('sw.js', sw);
          fs.writeFileSync('NOTES.md', notes);
          console.log('Applied the scoped 4.48.1 Daily rank fix.');
          NODE
      - name: Run regression checks against patched source
        run: node test/daily-rank.js
      - name: Commit verified fix on repair branch only
        shell: bash
        run: |
          rm .github/workflows/_apply-daily-rank-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js NOTES.md .github/workflows/_apply-daily-rank-fix.yml
          git commit -m 'Fix lifetime Daily rank badges and recover recorded World Beater unlocks (4.48.1)'
          git push origin HEAD:fix/daily-rank-badges-4-48-1
          git rev-parse HEAD
