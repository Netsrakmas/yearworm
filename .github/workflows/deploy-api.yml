name: Deploy API (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-api.yml"]

permissions:
  contents: read

concurrency:
  group: yearworm-api-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "068a305342a3734354d0697da0dec1a5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test statistics, privacy and gameplay before production changes
        run: |
          node server/stats-test.js
          node test/worker.mjs
          node test/funnel.js
          node test/interface.js
          node test/daily-rank.js
          node test/daily-day.js
          node test/deck-region.js

      - name: Require the owner dashboard secret
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          node -e "if(!process.env.STATS_KEY || process.env.STATS_KEY.length < 32) throw Error('Configure a random STATS_KEY GitHub Actions secret with at least 32 characters')"

      - name: Verify the Cloudflare token before doing anything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::secret CLOUDFLARE_API_TOKEN is empty or missing"; exit 1; fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          # user tokens verify on /user/..., account-owned tokens on /accounts/<id>/... — accept either
          RESP=$(curl -sS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if ! echo "$RESP" | grep -q '"success":\s*true'; then
            RESP2=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
            echo "$RESP2" | grep -q '"success":\s*true' \
              || { echo "::error::Cloudflare rejected the token on both verify endpoints. user: $RESP · account: $RESP2"; exit 1; }
            echo "account-owned token verified ✓"
          else
            echo "user token verified ✓"
          fi

      - name: Resolve the existing production D1 database
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ID=$(npx --yes wrangler@4.132.0 d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);const m=a.find(x=>x.name==='yearworm');console.log(m?m.uuid:'')})")
          if [ -z "$ID" ]; then echo "could not resolve database id"; exit 1; fi
          sed -i "s/PASTE_DATABASE_ID_HERE/$ID/" wrangler.toml
          echo "using database $ID"

      - name: Apply schema
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.132.0 d1 execute yearworm --remote --file=schema.sql --yes

      - name: Verify production funnel table shape without reading personal data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node server/verify-funnel.mjs

      - name: Deploy worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          # Upload the key with the protected code, never enable the old URL-key
          # dashboard in between. The temporary file is never an artifact.
          SECRET_FILE="$RUNNER_TEMP/yearworm-stats-secret.json"
          trap 'rm -f "$SECRET_FILE"' EXIT
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({STATS_KEY:process.env.STATS_KEY}), {mode:0o600})" "$SECRET_FILE"
          npx --yes wrangler@4.132.0 deploy --secrets-file "$SECRET_FILE" | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "### Worker deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify protected production dashboard and health
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: node server/stats-smoke.mjs
